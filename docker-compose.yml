# Hardened dsh — DeepSeek harness CLI inside a locked-down container.
# See README.md for usage and hardening rationale.

x-dsh-base: &dsh-base
  image: dsh-hardened:latest
  build: .
  user: "1000:1000"
  init: true
  cap_drop:
    - ALL
  security_opt:
    - no-new-privileges:true
  read_only: true
  tmpfs:
    - /tmp:noexec,nosuid,size=64m
  volumes:
    - dsh-home:/data
    - ./workspace:/workspace
  pids_limit: 512
  mem_limit: 4g
  cpus: "4"
  restart: unless-stopped
  logging:
    driver: json-file
    options:
      max-size: "10m"
      max-file: "3"
  environment:
    - DEEPSEEK_API_KEY=${DEEPSEEK_API_KEY:-}
    - GIT_AUTHOR_NAME=${GIT_AUTHOR_NAME:-}
    - GIT_AUTHOR_EMAIL=${GIT_AUTHOR_EMAIL:-}
    - GIT_COMMITTER_NAME=${GIT_COMMITTER_NAME:-}
    - GIT_COMMITTER_EMAIL=${GIT_COMMITTER_EMAIL:-}
    # Bind-mounted repos are owned by the host uid, not the container's uid 1000.
    # Git's safe.directory check would reject them. A system gitconfig is baked
    # into the image at build time (/etc/gitconfig, see Dockerfile) and pointed
    # at here via GIT_CONFIG_SYSTEM. dsh's command-spawn credential scrub strips
    # env-var names matching /KEY|PASSWORD|SECRET|TOKEN/i, so the previous
    # GIT_CONFIG_COUNT/KEY_0/VALUE_0 trio broke: COUNT survived the scrub but
    # KEY_0 was stripped -> "missing config key GIT_CONFIG_KEY_0". GIT_CONFIG_SYSTEM
    # survives the scrub and is in dsh's bootstrap env allowlist.
    - GIT_CONFIG_SYSTEM=/etc/gitconfig
    # Self-declare the isolation platform so any agent/MCP tooling inside the
    # container can detect the sandbox and skip host-only behavior (GUI opens,
    # host paths, host-only CLIs). Mirrors Warp's WARP_ISOLATION_PLATFORM env
    # var; /.dockerenv already exists implicitly, but an explicit declaration
    # is clearer and survives non-Docker runtimes.
    - DSH_ISOLATION_PLATFORM=docker
    - IS_SANDBOXED=1
    # dsh 0.2+ materializes native addons under os.tmpdir() by default; our
    # /tmp is noexec, which breaks dlopen ("failed to map segment"). Disable
    # the cache so prebuilds load from the executable rootfs under /usr/local.
    - NARB_DISABLE_NATIVE_CACHE=1
    # Installers (pnpm/npm) and many tools default to os.tmpdir()=/tmp.
    # /tmp is a 64MB noexec tmpfs (hardening). Point scratch + package caches
    # at the writable dsh-home volume so plugin installs do not ENOSPC.
    - TMPDIR=/data/tmp
    - TMP=/data/tmp
    - TEMP=/data/tmp
    - npm_config_cache=/data/.npm
    - XDG_CACHE_HOME=/data/cache
    # PNPM_HOME is also set in the image ENV to /data/.pnpm

services:
  # LiteLLM proxy: routes dsh -> TensorFold (:8421, ~/models/tensorfold) primary,
  # optional oMLX (:8000). Started with 'docker compose up -d litellm'.
  litellm:
    image: ghcr.io/berriai/litellm:main-latest
    command: ["--config", "/config.yaml", "--port", "4000"]
    ports:
      - "127.0.0.1:4000:4000"
    volumes:
      - ./litellm-config.yaml:/config.yaml:ro
      - ./litellm_hooks.py:/app/litellm_hooks.py:ro
    environment:
      - DEEPSEEK_API_KEY=${DEEPSEEK_API_KEY:-}
      - PYTHONPATH=/app
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    healthcheck:
      test: ["CMD-SHELL", "python -c 'import urllib.request; urllib.request.urlopen(\"http://localhost:4000/health/liveliness\")' || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s

  dsh-web:
    <<: *dsh-base
    entrypoint: ["/usr/local/bin/web-entrypoint.sh"]
    ports:
      - "127.0.0.1:8080:8080"

  dsh-headless:
    <<: *dsh-base

volumes:
  dsh-home:
