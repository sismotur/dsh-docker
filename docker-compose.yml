# Hardened dsh — DeepSeek harness CLI inside a locked-down container.
# See README.md for usage and hardening rationale.

x-dsh-base: &dsh-base
  image: dsh-hardened:latest
  build: .
  user: "1000:1000"
  cap_drop:
    - ALL
  security_opt:
    - no-new-privileges:true
  read_only: true
  tmpfs:
    - /tmp:noexec,nosuid,size=64m
  volumes:
    - dsh-home:/data
    - ./workspace:/workspace
  pids_limit: 512
  mem_limit: 4g
  cpus: "4"
  environment:
    - DEEPSEEK_API_KEY=${DEEPSEEK_API_KEY:-}

services:
  dsh-web:
    <<: *dsh-base
    entrypoint: ["/usr/local/bin/web-entrypoint.sh"]
    ports:
      - "127.0.0.1:8080:8080"

  dsh-headless:
    <<: *dsh-base

volumes:
  dsh-home:
