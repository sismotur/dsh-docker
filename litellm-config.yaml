# LiteLLM proxy config for dsh-docker
# dsh -> litellm:4000 -> TensorFold native on host.docker.internal
#
# Live backends:
#   tf-nemotron :8425  Nemotron 3.5 Lightning (default / smart-router)
#   tf-qwen38   :8423  TensorFold/Qwen3.8-27B-MLX-4bit + DFlash2
# Thinking off on both. API key: DEEPSEEK_API_KEY (any local value).

model_list:
  - model_name: tf-qwen38
    litellm_params:
      model: openai/tf-qwen38
      api_base: http://host.docker.internal:8423/v1
      api_key: os.environ/DEEPSEEK_API_KEY
      drop_params: true
      extra_body:
        chat_template_kwargs:
          enable_thinking: false

  - model_name: tf-nemotron
    litellm_params:
      model: openai/tf-nemotron
      api_base: http://host.docker.internal:8425/v1
      api_key: os.environ/DEEPSEEK_API_KEY
      drop_params: true
      extra_body:
        chat_template_kwargs:
          enable_thinking: false

  - model_name: Nemotron-3.5-Lightning-30B-A3B-4bit
    litellm_params:
      model: openai/tf-nemotron
      api_base: http://host.docker.internal:8425/v1
      api_key: os.environ/DEEPSEEK_API_KEY
      drop_params: true
      extra_body:
        chat_template_kwargs:
          enable_thinking: false

  - model_name: nemotron35-lightning-30b-a3b-4bit
    litellm_params:
      model: openai/tf-nemotron
      api_base: http://host.docker.internal:8425/v1
      api_key: os.environ/DEEPSEEK_API_KEY
      drop_params: true
      extra_body:
        chat_template_kwargs:
          enable_thinking: false

  - model_name: smart-router
    litellm_params:
      model: auto_router/complexity_router
      complexity_router_config:
        tiers:
          SIMPLE: tf-nemotron
          MEDIUM: tf-nemotron
          COMPLEX: tf-nemotron
          REASONING: tf-nemotron
        classification_mode: user_turn
      complexity_router_default_model: tf-nemotron

litellm_settings:
  num_retries: 2
  request_timeout: 300
  callbacks:
    - litellm_hooks.proxy_handler_instance
  fallbacks:
    - smart-router:
        - tf-nemotron
        - tf-qwen38
    - tf-nemotron:
        - Nemotron-3.5-Lightning-30B-A3B-4bit
        - tf-qwen38
    - Nemotron-3.5-Lightning-30B-A3B-4bit:
        - tf-nemotron
        - tf-qwen38
    - nemotron35-lightning-30b-a3b-4bit:
        - tf-nemotron
        - tf-qwen38
    - tf-qwen38:
        - tf-nemotron

general_settings:
  master_key: os.environ/DEEPSEEK_API_KEY
