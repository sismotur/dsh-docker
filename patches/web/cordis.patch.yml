# Your patch layer for this dsh profile, applied after every bundle layer:
# a top-level YAML array of loader patch entries (id-targeted config
# overrides, disables, and insert lists; `!!js` expressions allowed).
#
# LiteLLM router: dsh -> litellm:4000 -> TensorFold (:8421 fast, :8423 Qwen3.8),
# oMLX (host :8000) optional for VL / non-TF checkpoints.
# Models root on host: ~/models/tensorfold
# API key: DEEPSEEK_API_KEY (apiKeyEnv). TensorFold ignores it; oMLX may not.
- id: llm-deepseek
  config:
    baseURL: http://litellm:4000/v1
    apiKeyEnv: DEEPSEEK_API_KEY
    reasoningEffort: high
    models:
      - id: smart-router
        name: smart-router (auto → TensorFold fast)
        contextWindow: 131072
      - id: omlx-qwen36
        name: TensorFold Qwen3.6-35B-A3B-4bit (fast)
        contextWindow: 131072
      - id: Qwen3.6-35B-A3B-4bit
        name: Qwen3.6-35B-A3B (TensorFold alias)
        contextWindow: 131072
      - id: qwen36-35b-4bit
        name: qwen36-35b-4bit (TensorFold alias)
        contextWindow: 131072
      - id: tf-qwen38
        name: TensorFold Qwen3.8-27B + DFlash2 (quality)
        contextWindow: 32768
      - id: Qwen3.8-27B-OptiQ-4bit
        name: Qwen3.8-27B-OptiQ (TensorFold + DFlash2)
        contextWindow: 32768
      - id: qwen38-27b-optiq-4bit
        name: qwen38-27b-optiq-4bit (TensorFold alias)
        contextWindow: 32768
      - id: DeepSeek-V4-Flash-0731-2.4bit-mixed
        name: DeepSeek-V4-Flash (oMLX, if up)
        contextWindow: 1048576
      - id: Qwen3-VL-30B-A3B-Instruct-4bit
        name: Qwen3-VL-30B-A3B (oMLX vision, if up)
        contextWindow: 262144
- id: agent-default-model
  config:
    provider: deepseek-official
    model: smart-router
# Match this Warp instance's terminal font size (appearance.text.font_size in
# ~/.warp/settings.toml). DSH only exposes content font size (12-17px); it has
# no font-family setting, so the font type itself cannot be matched here.
- id: ui-theme
  config:
    fontSize: 13
# MCP memory server: knowledge-graph memory across sessions. Pre-installed in
# the image (no npx, no runtime network). The memory file persists on the
# DSH_HOME volume at /data/memory.jsonl. Tools are exposed as mcp__memory__*.
- insert:
    - id: mcp-memory
      name: '@deepseek-ai/dsh-mcp-client'
      config:
        transport: stdio
        serverName: memory
        command: node
        args:
          - /usr/local/lib/node_modules/@modelcontextprotocol/server-memory/dist/index.js
        env:
          MEMORY_FILE_PATH: /data/memory.jsonl
