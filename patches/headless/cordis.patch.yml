# Your patch layer for this dsh profile, applied after every bundle layer:
# a top-level YAML array of loader patch entries (id-targeted config
# overrides, disables, and insert lists; `!!js` expressions allowed).
#
# LiteLLM router: dsh -> litellm:4000 -> TensorFold native 1.1.1
# (:8425 Nemotron default, :8423 Qwen3.8 quality).
# Models root on host: ~/models/tensorfold
# API key: DEEPSEEK_API_KEY (apiKeyEnv). TensorFold ignores it.
- id: llm-deepseek
  config:
    baseURL: http://litellm:4000/v1
    apiKeyEnv: DEEPSEEK_API_KEY
    reasoningEffort: high
    models:
      - id: smart-router
        name: smart-router → Nemotron (131k, default)
        contextWindow: 131072
      - id: tf-nemotron
        name: Nemotron 3.5 Lightning (:8425, 131k)
        contextWindow: 131072
      - id: tf-qwen38
        name: Qwen3.8-27B MLX-4bit + DFlash2 (:8423, 131k)
        contextWindow: 131072
- id: agent-default-model
  config:
    provider: deepseek-official
    model: smart-router

# Local TensorFold backends only accept function tools. Disable dsh built-in
# web_search / web_search_preview server tools so they are not advertised to the model.
- id: tool-web
  disabled: true
- id: web-search-deepseek
  disabled: true
# Same as web: PTY bash must --rcfile aliases so project name is visible.
- id: terminal-bash
  config:
    shellArgs:
      - --rcfile
      - /etc/profile.d/dsh-aliases.sh
      - -i
# MCP memory server: knowledge-graph memory across sessions. Pre-installed in
# the image (no npx, no runtime network). The memory file persists on the
# DSH_HOME volume at /data/memory.jsonl. Tools are exposed as mcp__memory__*.
- insert:
    - id: mcp-memory
      name: '@deepseek-ai/dsh-mcp-client'
      config:
        transport: stdio
        serverName: memory
        command: node
        args:
          - /usr/local/lib/node_modules/@modelcontextprotocol/server-memory/dist/index.js
        env:
          MEMORY_FILE_PATH: /data/memory.jsonl
