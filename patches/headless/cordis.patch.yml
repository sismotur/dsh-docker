# Your patch layer for this dsh profile, applied after every bundle layer:
# a top-level YAML array of loader patch entries (id-targeted config
# overrides, disables, and insert lists; `!!js` expressions allowed).
#
# oMLX integration (container variant): repoint the deepseek-official adapter
# at the oMLX OpenAI-compatible server running ON THE HOST, reachable from the
# container via host.docker.internal:8000. The API key is read from the
# DEEPSEEK_API_KEY environment variable (apiKeyEnv below), passed through by
# docker compose.
- id: llm-deepseek
  config:
    baseURL: http://host.docker.internal:8000/v1
    apiKeyEnv: DEEPSEEK_API_KEY
    reasoningEffort: high
    models:
      - id: Qwen3-Coder-30B-A3B-Instruct-4bit
        name: Qwen3-Coder-30B-A3B (fast coder)
        contextWindow: 262144
      - id: Qwen3.6-35B-A3B-4bit
        name: Qwen3.6-35B-A3B (fast + thinking)
        contextWindow: 262144
      - id: DeepSeek-V4-Flash-0731-2.4bit-mixed
        name: DeepSeek-V4-Flash (max quality, 1M ctx)
        contextWindow: 1048576
      - id: Qwen3.8-27B-OptiQ-4bit
        name: Qwen3.8-27B-OptiQ
        contextWindow: 262144
- id: agent-default-model
  config:
    provider: deepseek-official
    model: Qwen3-Coder-30B-A3B-Instruct-4bit
# MCP memory server: knowledge-graph memory across sessions. Pre-installed in
# the image (no npx, no runtime network). The memory file persists on the
# DSH_HOME volume at /data/memory.jsonl. Tools are exposed as mcp__memory__*.
- insert:
    - id: mcp-memory
      name: '@deepseek-ai/dsh-mcp-client'
      config:
        transport: stdio
        serverName: memory
        command: node
        args:
          - /usr/local/lib/node_modules/@modelcontextprotocol/server-memory/dist/index.js
        env:
          MEMORY_FILE_PATH: /data/memory.jsonl
